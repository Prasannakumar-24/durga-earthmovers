<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#1a1a1a"/>
  <rect width="800" height="600" fill="url(#gradient)" opacity="0.2"/>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#f4c430" text-anchor="middle">LORRY</text>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">Heavy-Duty Transport</text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="18" fill="#808080" text-anchor="middle">Material Transportation</text>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a520;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>