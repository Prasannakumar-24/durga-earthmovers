services:
  - type: web
    name: durga-earthmovers-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Set these in the Render dashboard (do not commit secrets):
      # - MONGO_URI
      # - EMAIL_USER
      # - EMAIL_PASS
      # - COMPANY_EMAIL
      # - COMPANY_PHONE
      # - COMPANY_WHATSAPP
